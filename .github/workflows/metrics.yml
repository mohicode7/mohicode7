# Save this file as .github/workflows/metrics.yml in your
# mohicode7/mohicode7 profile repository.
#
# It regenerates github-metrics.svg on a schedule (and on manual trigger)
# by calling the lowlighter/metrics Action, then commits the SVG straight
# into the repo. Because the image is a committed file rather than a live
# call to a shared vercel.app endpoint, it can't go down the way
# github-readme-stats / activity-graph currently are.
#
# No extra secrets are required: GITHUB_TOKEN is provided automatically
# by GitHub Actions and has enough scope to read your public stats and
# push the updated SVG back to this repo.

name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # once a day, midnight UTC
  workflow_dispatch: {}     # allows manual "Run workflow" trigger

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: mohicode7
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          config_timezone: Europe/Berlin
